<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课程讲义系统</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="portal-body">
  <div class="portal">
    <div class="portal-logo">📚</div>
    <h1>课程讲义系统</h1>
    <p class="portal-sub">老师编写并发布讲义，学生在线阅读已发布内容</p>
    <div class="portal-cards">
      <a class="portal-card-link teacher" href="teacher.html">
        <span class="portal-emoji">🧑‍🏫</span>
        <strong>老师端</strong>
        <em>维护课程 / 章节 / 讲义正文与发布状态</em>
      </a>
      <a class="portal-card-link student" href="student.html">
        <span class="portal-emoji">🧑‍🎓</span>
        <strong>学生端</strong>
        <em>浏览课程目录，阅读已发布讲义</em>
      </a>
    </div>
    <p class="portal-hint">
      默认后端地址 <code>http://localhost:8080</code>，老师令牌默认
      <code>teacher-123456</code>，可在各页面顶栏直接修改（保存在浏览器本地）。
    </p>
  </div>
</body>
</html>
